name: Supporting mathematical checks
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python code/check_manifest.py
      - run: python code/verify.py --out /tmp/friction-normal
      - run: python -O code/verify.py --out /tmp/friction-optimized
      - run: python code/test_negative.py
